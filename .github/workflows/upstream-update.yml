name: Check upstream updates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-from-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find latest upstream tag
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          current="$(cat custom/upstream-base.txt | tr -d '[:space:]')"
          latest="$(
            git ls-remote --tags --refs https://github.com/awalol/DS5Dongle.git 'refs/tags/v*' |
              awk -F/ '{print $NF}' |
              sort -V |
              tail -n 1
          )"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$latest" ]; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop when already current
        if: steps.upstream.outputs.needs_update == 'false'
        shell: bash
        run: echo "Already tracking ${{ steps.upstream.outputs.current }}."

      - name: Merge upstream tag
        if: steps.upstream.outputs.needs_update == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/awalol/DS5Dongle.git
          git fetch upstream "refs/tags/${{ steps.upstream.outputs.latest }}:refs/tags/${{ steps.upstream.outputs.latest }}"
          git merge --no-edit "refs/tags/${{ steps.upstream.outputs.latest }}"

      - name: Reapply custom haptics patch
        if: steps.upstream.outputs.needs_update == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_custom_haptics_gain.py
          printf '%s\n' "${{ steps.upstream.outputs.latest }}" > custom/upstream-base.txt

      - name: Create update pull request
        if: steps.upstream.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: automation/upstream-${{ steps.upstream.outputs.latest }}
          delete-branch: true
          title: "Update upstream base to ${{ steps.upstream.outputs.latest }}"
          commit-message: "Update upstream base to ${{ steps.upstream.outputs.latest }}"
          body: |
            Updates this fork from upstream `${{ steps.upstream.outputs.current }}` to `${{ steps.upstream.outputs.latest }}`.

            Custom patch reapplied:
            - `haptics_gain` minimum remains `0.25`

            After this PR is merged, publish a GitHub Release from the fork tag to build and upload custom UF2 files.
